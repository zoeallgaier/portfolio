<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#e1e1e8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0e0e15" media="(prefers-color-scheme: dark)" />
  <title>Zoe Allgaier — Page not found</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/icons/z-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="/icons/z-16.png" sizes="16x16" type="image/png" />
  <link rel="apple-touch-icon" href="/icons/z-180.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Oxygen:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    /* Centred above the footer, so a dead link still lands somewhere that
       looks like the rest of the site. */
    .notfound {
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 1.5rem;
      gap: 1rem;
    }
    .notfound-code {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: clamp(4rem, 14vw, 9rem);
      line-height: 1;
      color: var(--muted);
    }
    .notfound h1 {
      font-family: 'Instrument Serif', serif;
      font-weight: 400;
      font-size: clamp(1.5rem, 4vw, 2.25rem);
    }
    .notfound p { color: var(--muted); max-width: 34ch; }
    .notfound-links {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 1rem;
    }
    .notfound-links a {
      border-bottom: 1px solid var(--rule);
      padding-bottom: 2px;
      transition: border-color 0.2s;
    }
    @media (hover: hover) {
      .notfound-links a:hover { border-color: var(--text); }
    }
  </style>
</head>

<body>

  <a href="#main-content" class="skip-link">Skip to main content</a>

  <nav data-chrome="nav"></nav>

  <main id="main-content" tabindex="-1" data-backdrop="quiet">
    <section class="notfound">
      <p class="notfound-code">404</p>
      <h1>This page wandered off</h1>
      <p>The link may be out of date, or the project moved somewhere new.</p>
      <div class="notfound-links">
        <a href="/">Back to work</a>
        <a href="/marginalia/">Marginalia</a>
        <a href="/about.html">About</a>
      </div>
    </section>
  </main>

  <footer id="contact" data-chrome="footer"></footer>

  <script src="/js/chrome.js"></script>
  <script src="/js/backdrop.js"></script>
  <script src="/js/footer.js"></script>
  <script src="/js/tabs.js"></script>
  <script src="/js/reveal.js"></script>
  <script src="/js/app.js"></script>
</body>

</html>
