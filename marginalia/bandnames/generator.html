<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Band Name Generator</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Oxygen:wght@300;400;700&display=swap" rel="stylesheet">
</head>

<body>

  <nav>
    <a href="/" class="nav-logo"><img src="/Zmono-dark.png" alt="Zoe Allgaier — Home"></a>
    <div class="nav-links">
      <a href="/marginalia/">All</a>
      <a href="/marginalia/?filter=posts">Posts</a>
      <a href="/marginalia/?filter=finds">Finds</a>
      <a href="/marginalia/?filter=library">Library</a>
    </div>
  </nav>

  <main id="main-content" tabindex="-1">
    <section class="hero">
      <canvas class="hero-canvas" aria-hidden="true"></canvas>
      <div class="hero-bg" aria-hidden="true"></div>

      <p class="hero-eyebrow">go ahead, name your band</p>

      <div class="name-display" aria-live="polite" aria-atomic="true">
        <span class="band-name" id="bandName"></span>
      </div>

      <div class="controls">
        <p class="counter" id="counter" aria-hidden="true"></p>
        <div class="controls-row">
          <button class="arrow-btn" id="prevBtn" aria-label="Previous name">←</button>
          <button class="generate-btn" id="generateBtn">next name</button>
          <button class="arrow-btn" id="nextBtn" aria-label="Next name">→</button>
        </div>
        <p class="hint hint--desktop">← → to go back &amp; forward &nbsp;·&nbsp; <kbd>space</kbd> for next</p>
        <p class="hint hint--mobile">tap anywhere to advance</p>
      </div>
    </section>
  </main>

  <footer id="contact">
    <p class="footer-prompt">If you've got a project where graphic, motion, and web all need to show up as one thing, I'd love to hear about it.</p>
    <div class="footer-bottom">
      <span>Zoe Allgaier</span>
      <span>© 2026</span>
    </div>
  </footer>

  <!-- Marginalia app chrome (top bar, bottom tab bar icons, publish "+"): the
       feed's script injects/enhances the shared nav; its feed logic no-ops here
       (no #feed). Loaded before the generator's own script. -->
  <script src="../main.js"></script>
  <script src="main.js"></script>

  <script src="/js/footer.js"></script>
</body>
</html>
