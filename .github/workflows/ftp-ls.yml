name: FTP directory listing (diagnostic)

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Crawl the FTP tree to find the web root
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set +e
          ls_dir() {
            curl -s --ssl-reqd --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/$1"
          }
          crawl() {
            local path="$1" depth="$2"
            [ "$depth" -gt 3 ] && return
            ls_dir "$path" | while read -r line; do
              name=$(echo "$line" | awk '{print $NF}')
              type=$(echo "$line" | cut -c1)
              [ "$name" = "." ] && continue
              [ "$name" = ".." ] && continue
              echo "  ${path}${name}   [type=$type]"
              case "$name" in
                _assets|node_modules|images|posts|mail|tmp|logs|.git|cgi-bin|.well-known) ;;
                *) if [ "$type" = "d" ]; then crawl "${path}${name}/" $((depth+1)); fi ;;
              esac
            done
          }
          echo "===== FTP TREE (from account root) ====="
          crawl "" 0
          echo "===== END ====="
