name: Deploy to GitHub Pages

# Every push to main publishes the site. There is no build step and no FTP —
# the repo *is* the site, so what you commit is what goes live.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Let the deploy publish to Pages, and don't pile up overlapping runs.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Browsers cache CSS/JS hard, so a fixed URL would serve returning
      # visitors stale styles after a design change. Appending the commit SHA
      # changes the URL whenever the site changes, forcing a fresh fetch.
      # Google Fonts and other absolute URLs are left alone.
      - name: Version CSS/JS references
        run: |
          V="${GITHUB_SHA::8}"
          find . -path ./.git -prune -o -name '*.html' -print | while read -r f; do
            sed -i -E 's#(="[^"]*\.(css|js))"#\1?v='"$V"'"#g' "$f"
          done
          echo "Versioned CSS/JS with ?v=$V"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
