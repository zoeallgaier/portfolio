name: Deploy to SiteGround

# Every push to main uploads the changed files to your SiteGround hosting.
# You can also trigger it by hand from the Actions tab (Run workflow).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the site
        uses: actions/checkout@v4

      # Recreate the publish password file from a secret, so it lives on the
      # server without the password ever being committed to git.
      - name: Write publish config
        env:
          PUBLISH_PASSWORD: ${{ secrets.PUBLISH_PASSWORD }}
        run: |
          printf "<?php\n\$PUBLISH_PASSWORD = '%s';\n" "$PUBLISH_PASSWORD" > marginalia/publish/config.php

      # Cache-bust: SiteGround long-caches static CSS/JS, so a fixed URL would
      # serve returning visitors stale styles/scripts. Append the commit SHA to
      # every stylesheet/script reference — a changed URL forces a fresh fetch,
      # so design/JS updates land immediately (Google Fonts URLs are untouched).
      - name: Version CSS/JS references
        run: |
          V="${GITHUB_SHA::8}"
          find . -path ./.git -prune -o -name '*.html' -print | while read -r f; do
            sed -i -E "s/(=\"[^\"]+\.(css|js))\"/\1?v=$V\"/g" "$f"
          done
          echo "Versioned CSS/JS with ?v=$V"

      - name: Upload to SiteGround over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ftps
          port: 21
          # The phone form writes these ON THE SERVER, so we never overwrite
          # them from git — that would wipe posts/photos made from your phone.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.DS_Store
            **/.claude/**
            **/node_modules/**
            marginalia/content.json
            _assets/marginalia/**
            marginalia/publish/DEPLOY.txt
            partials/**
            scripts/**
