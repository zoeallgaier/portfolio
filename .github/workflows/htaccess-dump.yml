name: Dump live .htaccess (diagnostic)

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Download the live web-root .htaccess
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set +e
          echo "===== BEGIN .htaccess ====="
          curl -s --ssl-reqd --user "$FTP_USERNAME:$FTP_PASSWORD" \
            "ftp://${FTP_SERVER}${FTP_SERVER_DIR}.htaccess"
          echo "===== END .htaccess ====="
