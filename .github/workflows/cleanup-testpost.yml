name: Cleanup test post (one-off)
on: { workflow_dispatch: {} }
jobs:
  rm:
    runs-on: ubuntu-latest
    steps:
      - env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          curl -s --ssl-reqd --user "$FTP_USERNAME:$FTP_PASSWORD" \
            "ftp://${FTP_SERVER}${FTP_SERVER_DIR}marginalia/posts/" \
            -Q "DELE ${FTP_SERVER_DIR}marginalia/posts/zz-composer-test.html" && echo "deleted"
