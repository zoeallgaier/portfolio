name: Push content.json to live

# Uploads ONLY marginalia/content.json to the live server — a surgical,
# single-file upload (no sync, no deletes), so your phone photos and anything
# else on the server are never touched. Run this after editing copy or removing
# a post. ⚠️ Pull content from live first, so you don't overwrite phone posts.
on:
  workflow_dispatch:

jobs:
  push-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload content.json over FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -e
          curl -s --ssl-reqd -T marginalia/content.json \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            "ftp://${FTP_SERVER}${FTP_SERVER_DIR}marginalia/content.json"
          echo "✅ content.json uploaded to the live site."
