name: Push marginalia images to live

# Uploads every image in _assets/marginalia/ to the live server (additive —
# it never deletes, so photos you've posted from your phone are never removed).
# Use this after adding images locally for a blog post. It's safe to re-run.
on:
  workflow_dispatch:

jobs:
  push-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload _assets/marginalia over FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -e
          shopt -s nullglob
          count=0
          for f in _assets/marginalia/*; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            curl -s --ssl-reqd -T "$f" \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              "ftp://${FTP_SERVER}${FTP_SERVER_DIR}_assets/marginalia/${name}"
            echo "  uploaded $name"
            count=$((count+1))
          done
          echo "✅ Uploaded $count image(s) to _assets/marginalia/."
